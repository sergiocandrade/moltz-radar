<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Møltz Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
</head>
<body>
<!-- LOGIN -->
<section id="login">
  <div class="lg-art">
    <canvas id="radarCanvas" aria-hidden="true"></canvas>
    <div class="mark" style="color:#fff">møltz<span class="dot"></span></div>
    <div>
      <h1>Sua carteira,<br><i>um passo à frente.</i></h1>
      <p>Renovações, ofertas e comissões da sua carteira, organizadas para você agir antes do mercado.</p>
    </div>
  </div>
  <div class="lg-form">
    <form class="lg-card" id="loginForm" novalidate>
      <h2>Entrar</h2>
      <div class="field"><label for="lgEmail">E-mail</label><input class="input" id="lgEmail" name="username" type="email" autocomplete="username" maxlength="128" required></div>
      <div class="field"><label for="lgPass">Senha</label><input class="input" id="lgPass" name="password" type="password" autocomplete="current-password" maxlength="256" required></div>
      <p class="sm" id="loginError" role="alert" style="color:var(--red)" hidden></p>
      <button class="btn solid lg" type="submit">Continuar</button>
      <p class="t3 sm">Primeiro acesso e recuperação de senha serão definidos na próxima etapa.</p>
    </form>
  </div>
</section>

<div id="welcome" hidden><h1>Olá, <i>corretor</i></h1></div>

<!-- APP -->
<div id="app" hidden>
  <header class="top"><div class="top-in">
    <a href="#inicio" data-go="inicio" class="mark">møltz<span class="dot"></span></a>
    <nav class="nav" id="nav"></nav>
    <div class="top-r">
      <button class="kbd-btn" data-act="cmd" aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Buscar</span><kbd>⌘K</kbd></button>
      <a class="ic-btn ai-ic ai-mobile" id="aiMobile" href="#assistente" data-go="assistente" aria-label="Assistente" title="Assistente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="s1" d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path class="s2" d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></a><button class="ic-btn theme-ic hide-m" data-act="theme" aria-label="Alternar modo claro e escuro" title="Modo claro / escuro"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><a class="ic-btn" href="#avisos" data-go="avisos" aria-label="Avisos" id="bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></a>
      <div class="more"><button class="me" data-act="menu" aria-haspopup="true" id="meBtn"></button><div class="menu" id="menu" hidden></div></div>
    </div>
  </div></header>
  <main class="page" id="page"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="cmd" id="cmd" hidden></div>
<div class="pop" id="pop" hidden role="dialog" aria-label="Filtro"></div>
<div class="bulk" id="bulk" role="region" aria-label="Ações em grupo"></div>
<div class="toast" id="toast"></div>

<script type="module" src="/src/app.js"></script>
</body>
</html>
